"finance/quotes":
  description: "Quotes"
  return: "VersionData<QuoteInfoIndex>"
"finance/base-rates/(BOK|FED|ECB|BOE|SNB|BOC|BOJ|CBR|RBI|PBOC|BCB)":
  description: "중앙은행 기준금리"
  return: "ExpiryData<InterestRateItem[]>"
  query: "{ cacheOnly?: boolean | undefined; }"
"finance/quote/${string}":
  description: "Quote"
  return: "ExpiryData<Quote>"
  query: "{ cacheOnly?: boolean | undefined; }"
"finance/quote-statistics/${string}":
  description: "Quote Statistics"
  return: "ExpiryData<QuoteStatistics>"
  query: "{ cacheOnly?: boolean | undefined; }"
"finance/quote-etf-holdings/${string}":
  description: "ETF에 포함된 주식들"
  return: "ExpiryData<QuoteEtfHoldings>"
  query: "{ cacheOnly?: boolean | undefined; }"
"finance/quote-history/${string}":
  description: "Quote History"
  return: "ExpiryData<QuoteHistory>"
  query: "{ cacheOnly?: boolean | undefined; }"
"finance/quote-history-summary/${string}":
  description: "[성능 최적화] Quote history에서 1W, 1M, 10Y... 와 같이 특정 과거 시점의 데이터를 추출해놓은 데이터"
  return: "VersionData<HistoryMatch<QuoteRecord>[]>"
  query: "{ cacheOnly?: boolean | undefined; }"
"finance/equity-value-history/${string}":
  description: "P/E History Chart의 Data Set: (Quote > EquityValue).trailingPE가 명확히 주입된 History 기록"
  return: "VersionData<EquityValueHistory>"
  query: "{ cacheOnly?: boolean | undefined; }"
"finance/kospi-pe":
