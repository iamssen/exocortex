  query: "{ cacheOnly?: boolean | undefined; }"
"finance/(shiller-pe|sp500-pe)":
  description: "Shiller P/E, SP500 P/E"
  return: "ExpiryData<DV<Ratio>[]>"
  query: "{ cacheOnly?: boolean | undefined; }"
"finance/sp500-earnings":
  description: "SP500 Earnings"
  return: "ExpiryData<DV<USD>[]>"
  query: "{ cacheOnly?: boolean | undefined; }"
"finance/(margin-debt|buffett-indicator)":
